name: Build & Deploy TravelHUB Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"       # Only trigger when frontend code changes

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Build Vite → Docker image → Push to Docker Hub
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.DOCKER_USER_NAME }}/travelhub-frontend:latest
            ${{ vars.DOCKER_USER_NAME }}/travelhub-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # Job 2: SSH to EC2 and deploy new frontend container
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy Frontend to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22
          script: |
            # Pull latest frontend image
            docker pull ${{ vars.DOCKER_USER_NAME }}/travelhub-frontend:latest

            # Stop & remove old container
            docker stop travelhub-frontend 2>/dev/null || true
            docker rm   travelhub-frontend 2>/dev/null || true

            # Run new container (Nginx serves Vite build on port 3000)
            docker run -d \
              --name travelhub-frontend \
              --restart unless-stopped \
              -p 3000:80 \
              ${{ vars.DOCKER_USER_NAME }}/travelhub-frontend:latest

            # Quick health check — Nginx should return 200
            sleep 5
            curl -f http://localhost:3000 || \
              (echo "❌ Frontend health check failed!" && docker logs travelhub-frontend --tail 30 && exit 1)

            echo "✅ Frontend deployment successful!"
