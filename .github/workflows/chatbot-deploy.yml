name: Build & Deploy TravelHUB Chatbot

on:
  push:
    branches:
      - main
    paths:
      - "chatbot-service/**"    # Only trigger when chatbot code changes

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Build Python image → Push to Docker Hub
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./chatbot-service
          push: true
          tags: |
            ${{ vars.DOCKER_USER_NAME }}/travelhub-chatbot:latest
            ${{ vars.DOCKER_USER_NAME }}/travelhub-chatbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # Job 2: SSH to EC2 and deploy new chatbot container
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy Chatbot to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22
          script: |
            # Pull latest chatbot image
            docker pull ${{ vars.DOCKER_USER_NAME }}/travelhub-chatbot:latest

            # Stop & remove old container
            docker stop travelhub-chatbot 2>/dev/null || true
            docker rm   travelhub-chatbot 2>/dev/null || true

            # Run new container
            # --mount persists ChromaDB vector data across container restarts
            docker run -d \
              --name travelhub-chatbot \
              --restart unless-stopped \
              -p 8001:8001 \
              --env-file /home/ubuntu/.env \
              --mount type=volume,src=chroma_data,dst=/app/chroma_data \
              ${{ vars.DOCKER_USER_NAME }}/travelhub-chatbot:latest

            # Wait for FastAPI + initial ChromaDB sync to complete
            sleep 20

            # Health check
            curl -f http://localhost:8001/health || \
              (echo "❌ Chatbot health check failed!" && docker logs travelhub-chatbot --tail 50 && exit 1)

            echo "✅ Chatbot deployment successful!"
