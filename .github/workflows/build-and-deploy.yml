name: Build & Deploy TravelHUB Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"        # Only trigger when backend code changes

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Build, Test, Docker Push
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build & Test with Maven
        working-directory: backend
        run: mvn clean package -B
        # Note: Tests that need DB are skipped via testng.xml config
        # If you want to skip all: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKER_USER_NAME }}/travelhub-backend:latest
            ${{ vars.DOCKER_USER_NAME }}/travelhub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # Job 2: SSH to EC2 and deploy
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push   # Wait for build job to finish

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.HOST_IP }}
          username: ubuntu          # Ubuntu AMI → ubuntu | Amazon Linux → ec2-user
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22
          script: |
            # Pull latest image
            docker pull ${{ vars.DOCKER_USER_NAME }}/travelhub-backend:latest

            # Stop & remove old container (ignore error if not running)
            docker stop travelhub-backend 2>/dev/null || true
            docker rm travelhub-backend 2>/dev/null || true

            # Run new container
            # Reads env vars from /home/ubuntu/.env on EC2
            docker run -d \
              --name travelhub-backend \
              --restart unless-stopped \
              -p 80:8080 \
              --env-file /home/ubuntu/.env \
              ${{ vars.DOCKER_USER_NAME }}/travelhub-backend:latest

            # Wait for app to start
            sleep 15

            # Health check
            curl -f http://localhost/actuator/health || \
              (echo "❌ Health check failed!" && docker logs travelhub-backend --tail 50 && exit 1)

            echo "✅ Deployment successful!"
